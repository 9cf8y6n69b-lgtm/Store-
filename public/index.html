<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Store Dashboard</title>
<style>
:root{--bg:#120a24;--card:#1d1238;--line:#6f4bd8;--pri:#9b6bff;--tx:#f1eaff;--mut:#b9a6e8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:radial-gradient(circle at top,#2a1654,var(--bg));color:var(--tx);min-height:100vh}
header{padding:16px;text-align:center;font-size:22px;font-weight:800}
nav{display:flex;gap:8px;padding:0 12px 12px;justify-content:center;flex-wrap:wrap}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--pri);border-color:var(--pri);font-weight:700}.btn.del{border-color:#ef476f;color:#ef476f}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:28px;color:var(--pri)}
input,select,textarea{width:100%;background:#120a24;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
input[type=checkbox]{width:auto}select[multiple]{min-height:110px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #3a2a68;text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:110px}.tbl{overflow-x:auto}
img.pv{max-width:100%;border-radius:12px;margin-top:8px}.mut{color:var(--mut);font-size:13px}
</style></head><body>
<div id="login" class="card" style="max-width:340px;margin:20vh auto">
 <h3>🔐 دخول الداشبورد</h3><input id="pw" type="password" placeholder="الباسورد" onkeydown="if(event.key=='Enter')login()">
 <br><br><button class="btn pri" onclick="login()">دخول</button> <span id="err"></span></div>
<div id="app" hidden><header>🌌 Nova Store</header><nav id="nav"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s);
const api=(u,m='GET',b)=>fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const CATS={basic:'🟢 بسيطة',standard:'🔵 متوسطة',premium:'🟣 متقدمة'};
const STAT={pending:'⏳ بانتظار الدفع',paid:'💳 تم الدفع',working:'🛠️ قيد التنفيذ',delivered:'✅ تم التسليم',cancelled:'❌ ملغي'};
const TABS={home:'📊 الرئيسية',products:'🤖 المنتجات',orders:'🧾 الطلبات',coupons:'🎟️ الكوبونات',welcome:'👋 الترحيب',tickets:'🎫 التذاكر',logs:'📜 اللوقات',commands:'🔨 الأوامر',levels:'⭐ المستويات',mod:'⚠️ التحذيرات',store:'🛒 إعدادات المتجر',general:'⚙️ عام',panels:'📢 البانلات'};
let guild={roles:[],channels:[]},schema=[],cfg={};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
async function login(){const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
 if(r.ok){$('#login').hidden=true;$('#app').hidden=false;guild=await api('/guild');schema=await api('/schema');
 $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button id="t-${k}" onclick="go('${k}')">${v}</button>`).join('');go('home')}else $('#err').textContent='❌ خطأ'}
async function go(t){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));$('#t-'+t).classList.add('on');$('#main').innerHTML='...';cfg=await api('/settings');await V[t]()}
const opts=(list,cur)=>`<option value="">— غير محدد —</option>${list.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${esc(x.name)}</option>`).join('')}`;
const sel=(id,list,cur)=>`<select id="${id}">${opts(list,cur)}</select>`;
const chans=()=>guild.channels.filter(c=>c.type==0),cates=()=>guild.channels.filter(c=>c.type==4);
function field(f){const v=cfg[f.key]??'',id='s_'+f.key;
 switch(f.type){case 'role':return sel(id,guild.roles,v);case 'channel':return sel(id,chans(),v);case 'category':return sel(id,cates(),v);
 case 'roles':{const cur=v.split(',');return `<select id="${id}" multiple>${guild.roles.map(r=>`<option value="${r.id}" ${cur.includes(r.id)?'selected':''}>${esc(r.name)}</option>`).join('')}</select><div class="mut">اضغط مطوّل/Ctrl لاختيار أكثر من رتبة</div>`}
 case 'bool':return `<select id="${id}"><option value="1" ${v=='1'?'selected':''}>✅ مفعّل</option><option value="0" ${v!='1'?'selected':''}>❌ معطّل</option></select>`;
 case 'textarea':case 'json':return `<textarea id="${id}" rows="${f.type=='json'?5:3}">${esc(v)}</textarea>`;
 case 'number':return `<input id="${id}" type="number" step="any" value="${esc(v)}">`;
 default:return `<input id="${id}" value="${esc(v)}">`}}
const form=(group,title)=>`<div class="card"><h3>${title}</h3>${schema.filter(f=>f.group==group).map(f=>`<label>${f.label}</label>${field(f)}`).join('')}<br><button class="btn pri" onclick="saveS('${group}')">💾 حفظ</button></div>`;
const V={
async home(){const s=await api('/stats');$('#main').innerHTML=`<div class="grid">
 ${[['orders','كل الطلبات'],['open','طلبات مفتوحة'],['delivered','مسلّمة'],['tickets','تذاكر مفتوحة'],['members','الأعضاء'],['warns','تحذيرات']].map(([k,l])=>`<div class="card stat"><b>${s[k]}</b>${l}</div>`).join('')}
 <div class="card stat"><b>${s.avgStars}⭐</b>متوسط التقييم</div></div>
 <div class="card"><h3>🏆 أفضل الستاف</h3><div class="tbl"><table><tr><th>الستاف</th><th>النقاط</th><th>استلم</th><th>سلّم</th></tr>
 ${s.topStaff.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.points}</td><td>${r.claimed}</td><td>${r.delivered}</td></tr>`).join('')}</table></div></div>`},
async products(){const p=await api('/products');$('#main').innerHTML=`<div class="card"><h3>➕ منتج جديد</h3><div class="row">
 <div><label>القسم</label><select id="nc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div><label>الاسم</label><input id="nn"></div><div><label>الأشهر</label><input id="nm" type="number" step="0.5"></div>
 <div><label>إيموجي</label><input id="ne" value="🤖"></div><button class="btn pri" onclick="addP()">إضافة</button></div></div>
 <div class="card tbl"><table><tr><th>القسم</th><th>الاسم</th><th>أشهر</th><th>إيموجي</th><th>فعّال</th><th></th></tr>
 ${p.map(x=>`<tr><td><select id="c${x.id}">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==x.category?'selected':''}>${v}</option>`).join('')}</select></td>
 <td><input id="n${x.id}" value="${esc(x.name)}"></td><td><input id="m${x.id}" type="number" step="0.5" value="${x.months}"></td>
 <td><input id="e${x.id}" value="${x.emoji}" style="width:60px"></td><td><input id="a${x.id}" type="checkbox" ${x.active?'checked':''}></td>
 <td><button class="btn pri" onclick="saveP(${x.id})">حفظ</button> <button class="btn del" onclick="delP(${x.id})">حذف</button></td></tr>`).join('')}</table></div>`},
async orders(){const o=await api('/orders');$('#main').innerHTML=`<div class="card tbl"><table><tr><th>#</th><th>العميل</th><th>الدفع</th><th>الحالة</th><th>المستلم</th><th>التاريخ</th></tr>
 ${o.map(x=>`<tr><td>${x.id}</td><td>${esc(x.user_name)}</td><td>${x.pay}</td><td><select onchange="setO(${x.id},this.value)">${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${k==x.status?'selected':''}>${v}</option>`).join('')}</select></td><td>${esc(x.claimed_name)||'-'}</td><td>${new Date(x.created).toLocaleString('ar')}</td></tr>`).join('')}</table></div>`},
async coupons(){const c=await api('/coupons');$('#main').innerHTML=`<div class="card"><h3>➕ كوبون</h3><div class="row"><div><label>الكود</label><input id="cc"></div>
 <div><label>الخصم %</label><input id="cp" type="number"></div><div><label>أقصى استخدام (0 = بلا حد)</label><input id="cm" type="number" value="0"></div>
 <button class="btn pri" onclick="addC()">إضافة</button></div></div><div class="card tbl"><table><tr><th>الكود</th><th>%</th><th>الاستخدام</th><th></th></tr>
 ${c.map(x=>`<tr><td>${esc(x.code)}</td><td>${x.percent}</td><td>${x.uses}/${x.max_uses||'∞'}</td><td><button class="btn del" onclick="delC('${esc(x.code)}')">حذف</button></td></tr>`).join('')}</table></div>`},
async welcome(){$('#main').innerHTML=form('welcome','👋 إعدادات الترحيب')+`<div class="card"><h3>👀 معاينة</h3><div class="row"><div><label>الروم</label>${sel('wch',chans())}</div><div><label>ID العضو للمعاينة (ايديك)</label><input id="wu"></div><button class="btn pri" onclick="wp()">أرسل معاينة</button></div><div class="mut">احفظ الإعدادات أولاً ثم أرسل المعاينة.</div><img class="pv" src="/assets/bg.png" style="max-width:260px"></div>`},
async tickets(){const c=await api('/tkcats');$('#main').innerHTML=form('tickets','🎫 إعدادات التذاكر')+`<div class="card"><h3>📂 أنواع التذاكر</h3><div class="row"><div><label>الاسم</label><input id="tn"></div><div><label>إيموجي</label><input id="te" value="🎫"></div><div><label>الوصف</label><input id="td"></div><button class="btn pri" onclick="addT()">إضافة</button></div>
 <div class="tbl"><table>${c.map(x=>`<tr><td><input id="tn${x.id}" value="${esc(x.name)}"></td><td><input id="te${x.id}" value="${x.emoji}" style="width:60px"></td><td><input id="td${x.id}" value="${esc(x.description)}"></td><td><button class="btn pri" onclick="saveT(${x.id})">حفظ</button> <button class="btn del" onclick="delT(${x.id})">حذف</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><div class="mut">بعد التعديل أرسل بانل التذاكر من تبويب 📢 البانلات.</div></div>`},
async logs(){$('#main').innerHTML=form('logs','📜 اللوقات — اختر روم لكل نوع')},
async commands(){const c=await api('/cmds');$('#main').innerHTML=`<div class="card"><h3>🔨 أوامر الإدارة (بادئة: ${esc(cfg.prefix)})</h3><div class="mut">الاختصارات مفصولة بفاصلة. الرتبة: اللي تقدر تستخدم الأمر (فاضي = صلاحية ديسكورد الافتراضية).</div>
 <div class="tbl"><table><tr><th>الأمر</th><th>الاختصارات</th><th>الرتبة</th><th>مفعّل</th><th></th></tr>
 ${c.map(x=>`<tr><td><b>${x.name}</b></td><td><input id="al${x.name}" value="${esc(x.aliases)}"></td><td>${sel('rl'+x.name,guild.roles,x.role)}</td><td><input id="en${x.name}" type="checkbox" ${x.enabled?'checked':''}></td><td><button class="btn pri" onclick="saveCmd('${x.name}')">حفظ</button></td></tr>`).join('')}</table></div></div>`},
async levels(){const r=await api('/levelroles');$('#main').innerHTML=form('levels','⭐ إعدادات المستويات')+`<div class="card"><h3>🏷️ رتب المستويات</h3><div class="row"><div><label>الفل</label><input id="lv" type="number"></div><div><label>الرتبة</label>${sel('lr',guild.roles)}</div><div><label>النوع</label><select id="lk"><option value="member">أعضاء</option><option value="staff">ستاف</option></select></div><button class="btn pri" onclick="addL()">إضافة</button></div>
 <div class="tbl"><table>${r.map(x=>`<tr><td>${x.kind=='staff'?'ستاف':'أعضاء'}</td><td>فل ${x.level}</td><td>${esc((guild.roles.find(y=>y.id==x.role_id)||{}).name||x.role_id)}</td><td><button class="btn del" onclick="delL(${x.id})">حذف</button></td></tr>`).join('')}</table></div></div>`},
async mod(){const w=await api('/warns');$('#main').innerHTML=`<div class="card tbl"><h3>⚠️ آخر التحذيرات</h3><table><tr><th>#</th><th>العضو</th><th>الإداري</th><th>السبب</th><th></th></tr>
 ${w.map(x=>`<tr><td>${x.id}</td><td>${esc(x.user_name)}</td><td>${esc(x.mod_name)}</td><td>${esc(x.reason)}</td><td><button class="btn del" onclick="delW(${x.id})">حذف</button></td></tr>`).join('')}</table></div>`},
async store(){$('#main').innerHTML=form('store','🛒 إعدادات المتجر')},
async general(){$('#main').innerHTML=form('general','⚙️ إعدادات عامة')},
async panels(){const ch=sel('pch',chans());$('#main').innerHTML=`<div class="card"><h3>📢 إرسال البانلات</h3><label>الروم</label>${ch}<br><br>
 <button class="btn pri" onclick="sp('store')">🛒 بانل المتجر</button> <button class="btn pri" onclick="sp('tickets')">🎫 بانل التذاكر</button></div>
 <div class="card"><h3>🖼️ الصور الافتراضية (مصنوعة من لوجو NOVA)</h3><div class="mut">تقدر تغيّرها بروابط من الإعدادات.</div>
 ${['store_banner','tickets_banner','ticket_inside','store_ticket'].map(n=>`<img class="pv" src="/assets/${n}.png">`).join('')}</div>`}
};
async function saveS(group){const b={};schema.filter(f=>f.group==group).forEach(f=>{const e=$('#s_'+f.key);b[f.key]=f.type=='roles'?[...e.selectedOptions].map(o=>o.value).join(','):e.value;
 if(f.type=='json'){try{JSON.parse(b[f.key])}catch{b._bad=f.label}}});
 if(b._bad)return alert('❌ JSON غير صحيح: '+b._bad);delete b._bad;const r=await api('/settings','PUT',b);alert(r.ok?'✅ تم الحفظ':'❌ خطأ')}
async function addP(){await api('/products','POST',{category:$('#nc').value,name:$('#nn').value,months:$('#nm').value,emoji:$('#ne').value});go('products')}
async function saveP(i){await api('/products/'+i,'PUT',{category:$('#c'+i).value,name:$('#n'+i).value,months:$('#m'+i).value,emoji:$('#e'+i).value,active:$('#a'+i).checked});alert('✅ تم')}
async function delP(i){if(confirm('حذف؟')){await api('/products/'+i,'DELETE');go('products')}}
async function setO(i,s){await api('/orders/'+i,'PATCH',{status:s})}
async function addC(){await api('/coupons','POST',{code:$('#cc').value,percent:$('#cp').value,max_uses:$('#cm').value});go('coupons')}
async function delC(c){await api('/coupons/'+c,'DELETE');go('coupons')}
async function addT(){await api('/tkcats','POST',{name:$('#tn').value,emoji:$('#te').value,description:$('#td').value});go('tickets')}
async function saveT(i){await api('/tkcats/'+i,'PUT',{name:$('#tn'+i).value,emoji:$('#te'+i).value,description:$('#td'+i).value});alert('✅ تم')}
async function delT(i){if(confirm('حذف؟')){await api('/tkcats/'+i,'DELETE');go('tickets')}}
async function saveCmd(n){await api('/cmds/'+n,'PUT',{aliases:$('#al'+n).value,role:$('#rl'+n).value,enabled:$('#en'+n).checked});alert('✅ تم')}
async function addL(){await api('/levelroles','POST',{level:$('#lv').value,role_id:$('#lr').value,kind:$('#lk').value});go('levels')}
async function delL(i){await api('/levelroles/'+i,'DELETE');go('levels')}
async function delW(i){await api('/warns/'+i,'DELETE');go('mod')}
async function sp(k){const r=await api('/panel/'+k,'POST',{channel:$('#pch').value});alert(r.ok?'✅ تم الإرسال':'❌ '+r.error)}
async function wp(){const r=await api('/panel/welcome','POST',{channel:$('#wch').value,user:$('#wu').value});alert(r.ok?'✅ تم':'❌ '+r.error)}
</script></body></html>
